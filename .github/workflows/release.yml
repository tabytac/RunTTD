name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            goos: linux
            goarch: amd64
            output_name: RunTTD-linux
          - os: windows-latest
            platform: windows-amd64
            goos: windows
            goarch: amd64
            output_name: RunTTD.exe
          - os: macos-latest
            platform: macos-universal
            goos: darwin
            output_name: RunTTD-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # Cache compiled objects (GOCACHE) so the Fyne/cgo stack isn't rebuilt from scratch.
      - name: Resolve GOCACHE path
        id: gocache
        shell: bash
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-${{ matrix.goarch || 'native' }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ matrix.goarch || 'native' }}-
            gobuild-${{ runner.os }}-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: go build -ldflags "-H=windowsgui -X main.Version=${{ github.ref_name }}" -o "dist/${{ matrix.output_name }}" ./cmd/runttd

      - name: Build binary (Linux)
        if: matrix.platform == 'linux-amd64'
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          go build -ldflags "-X main.Version=${{ github.ref_name }}" -o dist/${{ matrix.output_name }} ./cmd/runttd

      - name: Build binary (macOS Universal)
        if: matrix.platform == 'macos-universal'
        env:
          CGO_ENABLED: 1
        run: |
          mkdir -p dist
          # Build for Intel
          GOARCH=amd64 go build -ldflags "-X main.Version=${{ github.ref_name }}" -o dist/launcher-amd64 ./cmd/runttd
          # Build for Apple Silicon
          GOARCH=arm64 go build -ldflags "-X main.Version=${{ github.ref_name }}" -o dist/launcher-arm64 ./cmd/runttd
          # Merge into universal binary
          lipo -create -output "dist/${{ matrix.output_name }}" dist/launcher-amd64 dist/launcher-arm64
          # Cleanup temporary binaries
          rm dist/launcher-amd64 dist/launcher-arm64

      - name: Prepare release artifact
        shell: bash
        run: |
          cd dist
          TAG=${{ github.ref_name }}
          PLATFORM=${{ matrix.platform }}
          BINARY=${{ matrix.output_name }}

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            RELEASE_FILE="RunTTD_${TAG}_${PLATFORM}.exe"
            cp "$BINARY" "$RELEASE_FILE"
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            RELEASE_FILE="RunTTD_${TAG}_${PLATFORM}.tar.gz"
            tar -czf "$RELEASE_FILE" "$BINARY"
          else
            # macOS Universal
            RELEASE_FILE="RunTTD_${TAG}_${PLATFORM}.zip"
            zip "$RELEASE_FILE" "$BINARY"
          fi

          echo "RELEASE_FILE=$RELEASE_FILE" >> $GITHUB_ENV

      - name: Upload release artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.platform }}
          path: dist/${{ env.RELEASE_FILE }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Resolve release body from annotated tag
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Read the annotated tag's message via the API. Lightweight tags have no
          # tag object (the ref points straight at a commit), so this is empty for
          # them; the leading bullets of an annotated message become the body.
          SHA=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')
          TYPE=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type')
          BODY=""
          if [ "$TYPE" = "tag" ]; then
            BODY=$(gh api "repos/$REPO/git/tags/$SHA" --jq '.message')
          fi
          # Trim leading/trailing whitespace to decide if the message is meaningful.
          TRIMMED=$(printf '%s' "$BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -n "$TRIMMED" ]; then
            printf '%s\n' "$BODY" > release_body.md
            echo "has_body=true" >> "$GITHUB_OUTPUT"
            echo "Using annotated tag message as the release body."
          else
            echo "has_body=false" >> "$GITHUB_OUTPUT"
            echo "No annotated tag message found; falling back to auto-generated notes."
          fi

      - name: Create GitHub Release (custom body)
        if: steps.notes.outputs.has_body == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          generate_release_notes: false
          files: dist/**/*

      - name: Create GitHub Release (auto-generated notes)
        if: steps.notes.outputs.has_body == 'false'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
