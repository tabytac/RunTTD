name: Release On Tag

on:
  push:
    tags:
      - '*'


permissions:
  contents: write

jobs:
  build:
    name: Build release binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            output_name: JGRPP_Launcher_linux
          - os: windows-latest
            output_name: JGRPP_Launcher.exe
          - os: macos-latest
            output_name: JGRPP_Launcher_macos

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          go build -ldflags "-H=windowsgui" -o "dist/${{ matrix.output_name }}" .

      - name: Build binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          go build -o dist/${{ matrix.output_name }} .

      - name: Upload release artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/JGRPP_Launcher.exe
            dist/JGRPP_Launcher_linux
            dist/JGRPP_Launcher_macos
